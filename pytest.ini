[pytest]
# Direct-mode tests run fully in-memory via the gltest direct plugin.
#
# The two `-p no:` entries below disable unrelated third-party pytest plugins
# (hydra, langsmith) that may be present in a shared environment and that fail
# to import under Python 3.14 (they reference the removed `typing.io`). They
# have nothing to do with this project; disabling them keeps `gltest` and
# `pytest` runs clean.
addopts = -p no:hydra_pytest -p no:langsmith_plugin -v -m "not integration"
testpaths = tests
markers =
    integration: live-network consensus tests (deploy to a real GenLayer network).
        Excluded from the default fast in-memory run. Enable explicitly with:
        gltest tests/integration/ -m integration --network studionet
